<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function driveDl(u){if(!u)return'';var m=String(u).match(/\/file\/d\/([\w-]+)/)||String(u).match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u;}
function driveView(u){if(!u)return'';var m=String(u).match(/\/file\/d\/([\w-]+)/)||String(u).match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800':u;}
function site(){return (window.SITE_DATA&&SITE_DATA.site)||{};}
function q(n){return new URLSearchParams(location.search).get(n);}
function findById(id){
  var d=window.SITE_DATA||{},x;
  x=(d.products||[]).find(function(p){return p.id===id;});if(x)return{type:'product',item:x};
  x=((d.content||{}).facebook||[]).find(function(p){return p.id===id;});if(x)return{type:'facebook',item:x};
  x=((d.content||{}).youtube||[]).find(function(p){return p.id===id;});if(x)return{type:'youtube',item:x};
  x=(d.playlists||[]).find(function(p){return p.id===id;});if(x)return{type:'playlist',item:x};
  return null;
}
function linkify(text){
  return esc(text||'').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function storeName(){ var s=site(); return s.name||s.brand||'محرك مصران'; }

function glassModal(title, html){
  var bd=document.getElementById('glassBd');
  if(!bd){
    bd=document.createElement('div'); bd.id='glassBd'; bd.className='glass-modal-backdrop';
    bd.innerHTML='<div class="glass-modal" role="dialog"><div class="d-flex justify-content-between align-items-start gap-2 mb-2"><h3 id="glassTitle"></h3><button type="button" class="btn btn-sm btn-outline-secondary" id="glassClose">إغلاق</button></div><div id="glassBody"></div></div>';
    document.body.appendChild(bd);
    bd.addEventListener('click',function(e){ if(e.target===bd) bd.classList.remove('open'); });
    document.getElementById('glassClose').onclick=function(){ bd.classList.remove('open'); };
  }
  document.getElementById('glassTitle').textContent=title||'';
  document.getElementById('glassBody').innerHTML=html||'';
  bd.classList.add('open');
}


function copyText(t, btn){
  t=String(t||'');
  function ok(){ if(btn){ btn.classList.add('ok'); btn.innerHTML='<i class="fas fa-check"></i>'; setTimeout(function(){ btn.classList.remove('ok'); btn.innerHTML='<i class="fas fa-copy"></i>'; },1200);} }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    document.body.removeChild(a);
  }
}
function idCopyHtml(id){
  return '<span class="id-with-copy"><code class="mono" style="direction:ltr">'+esc(id)+'</code> <button type="button" class="btn-copy-id" title="نسخ" data-copy="'+esc(id)+'"><i class="fas fa-copy"></i></button></span>';
}
function wireCopy(root){
  (root||document).querySelectorAll('[data-copy]').forEach(function(b){
    if(b._copyBound) return; b._copyBound=true;
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); copyText(b.getAttribute('data-copy'), b); };
  });
}

function deviceId(){
  var k='misran_device_id', ko='misran_device_id_original';
  try{
    var v=localStorage.getItem(k);
    if(v&&v.length>10) return v;
    var id='u_'+Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    localStorage.setItem(k,id);
    if(!localStorage.getItem(ko)) localStorage.setItem(ko,id);
    return id;
  }catch(e){
    return 'u_tmp_'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  }
}
function userEntitlements(){
  var d=window.SITE_DATA||{};
  var map=d.entitlements||{};
  return map[deviceId()]||[];
}
function userOwns(productId){
  return userEntitlements().indexOf(productId)>=0;
}

function originalDeviceId(){
  var k='misran_device_id_original';
  try{
    var o=localStorage.getItem(k);
    if(o) return o;
    var cur=localStorage.getItem('misran_device_id');
    if(cur){ localStorage.setItem(k,cur); return cur; }
  }catch(e){}
  return deviceId();
}
function isValidSiteId(id){
  id=String(id||'').trim();
  // algorithm: u_ + 32 hex from crypto random
  if(/^u_[a-f0-9]{32}$/i.test(id)) return true;
  // legacy shorter ids from older generator
  if(/^u_[a-z0-9]{10,}$/i.test(id)) return true;
  return false;
}
function setActiveDeviceId(id){
  try{ localStorage.setItem('misran_device_id', id); }catch(e){}
}

function applyBrand(){

      el.innerHTML='<img src="'+esc(src)+'" style="height:26px;border-radius:5px;object-fit:contain" alt=""> '+esc(name);
    });

  var phone=(s.supportPhone||'').trim();

    bar.innerHTML=linkify(n.text);
    document.body.insertBefore(bar, document.body.firstChild);
  }
}
function markNav(){
  var path=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  if(!path || path==='/') path='index.html';
  document.querySelectorAll('.nav-pill-link').forEach(function(a){
    var h=(a.getAttribute('href')||'').split('?')[0].toLowerCase();
    a.classList.toggle('is-active', h===path || ((path===''||path==='index.html')&&h==='index.html'));
  });
  var ind=document.getElementById('navIndicator'), nav=document.getElementById('mainNav');
  if(!ind||!nav) return;
  // موبايل: اخفي المؤشر الذهبي المتحرك
  if(window.matchMedia('(max-width:900px)').matches){
    ind.style.width='0'; ind.style.opacity='0'; return;
  }
  var a=document.querySelector('.nav-pill-link.is-active');
  if(!a){ ind.style.width='0'; ind.style.opacity='0'; return; }
  // حساب دقيق: الخلفية الذهبية تلف الزر + الأيقونة بالكامل
  var nr=nav.getBoundingClientRect();
  var r=a.getBoundingClientRect();
  var padX=2; // هامش خفيف
  var top=Math.max(4, r.top-nr.top);
  var height=Math.max(28, r.height);
  var left=Math.max(0, r.left-nr.left-padX);
  var width=Math.max(0, r.width+padX*2);
  ind.style.opacity='1';
  ind.style.top=top+'px';
  ind.style.height=height+'px';
  ind.style.left=left+'px';
  ind.style.width=width+'px';
}
function wireNav(){
  document.querySelectorAll('.nav-pill-link, .nav-pill-brand, a.btn-hero, a.btn-primary-custom').forEach(function(a){
    var href=a.getAttribute('href')||'';
    if(!href||href.indexOf('http')===0||href.charAt(0)==='#'||href.indexOf('mailto:')===0||href.indexOf('tel:')===0) return;
    a.addEventListener('click',function(e){
      var dest=href.split('?')[0].toLowerCase();
      var cur=(location.pathname.split('/').pop()||'index.html').toLowerCase();
      if(dest===cur) return;
      e.preventDefault(); navigateTo(href);
    });
  });
}

  var dis = readonly ? ' checked disabled' : '';
  var labClass = readonly ? ' class="readonly"' : '';
  return '<div class="consent-section"><h4>سياسة الخصوصية</h4><div class="consent-scroll"><p>نحن نحترم خصوصيتك. عند استخدامك لهذا الموقع، قد يتم تخزين معرّف جهاز محلي (Device ID) على متصفحك لغرض تفعيل المنتجات الرقمية التي تشتريها أو تحصل عليها مجاناً، ولتحسين تجربة الاستخدام.</p><p>لا نجمع بيانات شخصية حساسة (مثل الاسم الحقيقي أو رقم البطاقة) عبر هذا الموقع إلا إذا قدمتها بنفسك طوعاً عند التواصل معنا.</p><p>قد تُستخدم ملفات تعريف الارتباط (Cookies) أو التخزين المحلي (Local Storage) لتشغيل الموقع وحفظ تفضيلاتك وموافقتك على الشروط.</p><p>روابط خارجية (مثل فيسبوك أو يوتيوب أو روابط التحميل) تخضع لسياسات الجهات المالكة لها، ولسنا مسؤولين عن محتواها.</p><p>باستخدامك للموقع فإنك توافق على هذه السياسة. يمكنك التواصل معنا عبر قنوات الدعم المتاحة في الموقع لأي استفسار يتعلق بالخصوصية.</p></div></div>'+'<div class="consent-section"><h4>الشروط والأحكام</h4><div class="consent-scroll"><p>باستخدامك لهذا الموقع وخدماته، فإنك توافق على الالتزام بالشروط التالية.</p><p><strong>1. طبيعة الخدمة:</strong> الموقع يقدم منتجات رقمية ومحتوى وتحميلاً لبرمجيات/محركات حسب ما هو معروض. بعض المنتجات مجانية وبعضها مدفوع.</p><p><strong>2. التفعيل:</strong> تفعيل المنتجات المدفوعة يتم عبر معرّف الجهاز. التفعيل شخصي وغير قابل للتحويل إلا بقرار من إدارة الموقع.</p><p><strong>3. الاستخدام المقبول:</strong> يُحظر إساءة استخدام الموقع، أو محاولة اختراقه، أو إعادة بيع المنتجات دون إذن، أو أي نشاط يخالف القانون المعمول به.</p><p><strong>4. إخلاء المسؤولية:</strong> نبذل جهداً لتقديم خدمة مستقرة، لكن لا نضمن خلو الموقع من الأعطال أو انقطاع الخدمة. استخدامك للمحتوى والمنتجات على مسؤوليتك.</p><p><strong>5. التعديلات:</strong> يحق لإدارة الموقع تعديل هذه الشروط أو السياسة أو المحتوى في أي وقت، ويُعد استمرار الاستخدام موافقة على التحديثات.</p><p><strong>6. التواصل:</strong> لأي شكاوى أو استفسارات استخدم قنوات الدعم المعروضة في الموقع.</p></div></div>'+
    '<div class="consent-section"><h4>الفيديو التعريفي</h4>'+videoBlock+'</div>'+
    '<div class="consent-checks">'+
      '<label'+labClass+'><input type="checkbox" id="ckPolicy"'+dis+'> أقر بأنني اطلعت على <strong>سياسة الخصوصية</strong> وأوافق عليها</label>'+
      '<label'+labClass+'><input type="checkbox" id="ckTerms"'+dis+'> أقر بأنني اطلعت على <strong>الشروط والأحكام</strong> وأوافق عليها</label>'+
      '<label'+labClass+'><input type="checkbox" id="ckVideo"'+dis+'> أقر بمعرفتي بوجود <strong>الفيديو التعريفي للموقع</strong></label>'+
    '</div>';
}
function ensureConsentUI(){
  if(document.getElementById('consentOverlay')) return;
  var ov=document.createElement('div'); ov.id='consentOverlay'; ov.className='consent-overlay';
  ov.innerHTML='<div class="consent-card" role="dialog" aria-modal="true">'+
    '<header><span id="consentTitle">مرحباً بك</span><span></span></header>'+
    '<div class="consent-body" id="consentBody"></div>'+
    '<div class="consent-footer" id="consentFooter"></div></div>';
  document.body.appendChild(ov);
}
function updateConfirmState(){
  var b=document.getElementById('consentConfirm');
  if(!b) return;
  var a=document.getElementById('ckPolicy');
  var t=document.getElementById('ckTerms');
  var v=document.getElementById('ckVideo');
  var ok=a&&t&&v&&a.checked&&t.checked&&v.checked;
  b.classList.toggle('ready', !!ok);
}
function openConsent(readonly){
  ensureConsentUI();
  var ov=document.getElementById('consentOverlay');
  document.getElementById('consentTitle').textContent = readonly ? 'السياسة والشروط' : 'مرحباً بك — يرجى الموافقة للمتابعة';
  document.getElementById('consentBody').innerHTML = buildConsentHTML(!!readonly);
  var foot=document.getElementById('consentFooter');
  if(readonly){
    foot.innerHTML='<button type="button" class="btn-confirm ready" id="consentCloseBtn" style="opacity:1;pointer-events:auto">إغلاق</button>';
    document.getElementById('consentCloseBtn').onclick=function(){ ov.classList.remove('open'); };
  } else {
    foot.innerHTML='<button type="button" class="btn-confirm" id="consentConfirm">تأكيد والمتابعة</button>';
    ['ckPolicy','ckTerms','ckVideo'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.addEventListener('change', updateConfirmState);
    });
    document.getElementById('consentConfirm').onclick=function(){
      if(!this.classList.contains('ready')) return;
      try{ localStorage.setItem('misran_consent_v1','1'); }catch(e){}
      ov.classList.remove('open');
    };
    updateConfirmState();
  }
  ov.classList.add('open');
}
function maybeShowFirstConsent(){
  try{
    if(localStorage.getItem('misran_consent_v1')==='1') return;
  }catch(e){}
  openConsent(false);
}
function ensureSettingsGear(){
  if(document.getElementById('settingsGear')) return;
  var g=document.createElement('button');
  g.id='settingsGear'; g.className='settings-gear'; g.type='button'; g.title='السياسة والشروط';
  g.innerHTML='<i class="fas fa-cog"></i>';
  g.onclick=function(){ openConsent(true); };
  document.body.appendChild(g);
}

function initChrome(){
  applyBrand(); markNav(); wireNav();
  ensureSettingsGear(); maybeShowFirstConsent();
  var tg=document.getElementById('navToggle');
  if(tg) tg.onclick=function(){document.getElementById('navLinks').classList.toggle('open');setTimeout(markNav,40);};
  window.addEventListener('resize',markNav);
  setTimeout(markNav,50);
  setTimeout(markNav,300);
  setTimeout(markNav,800);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){markNav();});
  
}
function paginate(list, page, per){
  var total=Math.max(1, Math.ceil(list.length/per)||1);
  page=Math.min(Math.max(1,page), total);
  return {items:list.slice((page-1)*per, page*per), page:page, total:total};
}
function renderPager(el, page, total, onPage){
  if(!el) return;
  if(total<=1){el.innerHTML='';return;}
  var html='<button type="button" '+(page<=1?'disabled':'')+' data-p="'+(page-1)+'">‹</button>';
  for(var i=1;i<=total;i++) html+='<button type="button" class="'+(i===page?'active':'')+'" data-p="'+i+'">'+i+'</button>';
  html+='<button type="button" '+(page>=total?'disabled':'')+' data-p="'+(page+1)+'">›</button>';
  el.innerHTML=html;
  el.querySelectorAll('button[data-p]').forEach(function(b){b.onclick=function(){if(!b.disabled) onPage(+b.getAttribute('data-p'));};});
}
document.addEventListener('DOMContentLoaded', function(){ initChrome(); });
</script>

<script>

document.addEventListener('DOMContentLoaded',function(){
  var plat=q('plat')||'youtube', page=1, PER=6, selectedPl=new Set();
  var tabFb=document.getElementById('tabFb'), tabYt=document.getElementById('tabYt');
  if(plat==='youtube'){ tabYt.classList.add('active','yt-active'); tabFb.classList.remove('active','fb-active'); }
  else { tabFb.classList.add('active','fb-active'); tabYt.classList.remove('active','yt-active'); }

  function sortedList(){
    var list=((SITE_DATA.content||{})[plat]||[]).filter(function(c){return c.status!=='hidden';});
    return list.slice().sort(function(a,b){ var ta=a.createdAt?Date.parse(a.createdAt):0, tb=b.createdAt?Date.parse(b.createdAt):0; return tb-ta; });
  }
  function playlists(){ return (SITE_DATA.playlists||[]).filter(function(pl){return pl.active!==false && (pl.plat===plat || !pl.plat);}); }
  function filtered(){
    var list=sortedList();
    if(!selectedPl.size) return list;
    var ids=new Set();
    playlists().forEach(function(pl){ if(selectedPl.has(pl.id)) (pl.itemIds||[]).forEach(function(i){ids.add(i);}); });
    return list.filter(function(c){return ids.has(c.id);});
  }
  function renderFilters(){
    var pls=playlists(), bar=document.getElementById('plFilters');
    if(!pls.length){ bar.innerHTML=''; return; }
    bar.innerHTML='<div class="small fw-bold mb-2 text-muted">قوائم التشغيل</div>'+
      '<label class="filter-chip '+(selectedPl.size===0?'on':'')+'"><input type="checkbox" id="plAll" '+(selectedPl.size===0?'checked':'')+'> الكل</label>'+
      pls.map(function(pl){
        var on=selectedPl.has(pl.id);
        return '<label class="filter-chip '+(on?'on':'')+'"><input type="checkbox" data-pl="'+esc(pl.id)+'" '+(on?'checked':'')+'> '+esc(pl.title)+'</label>';
      }).join('');
    var all=document.getElementById('plAll');
    if(all) all.onchange=function(){ if(all.checked) selectedPl.clear(); page=1; renderFilters(); render();
  var autoId=q('id');
  if(autoId){ var found=findById(autoId); if(found&&found.item&&found.item.videoUrl){ window.open(found.item.videoUrl,'_blank'); } } };
    bar.querySelectorAll('[data-pl]').forEach(function(inp){
      inp.onchange=function(){ if(inp.checked) selectedPl.add(inp.getAttribute('data-pl')); else selectedPl.delete(inp.getAttribute('data-pl')); page=1; renderFilters(); render();
  var autoId=q('id');
  if(autoId){ var found=findById(autoId); if(found&&found.item&&found.item.videoUrl){ window.open(found.item.videoUrl,'_blank'); } } };
    });
  }
  function tile(c){
    var th=c.thumbUrl?driveView(c.thumbUrl):'';
    var badge=plat==='youtube' ? '<span class="plat-badge plat-yt"><i class="fab fa-youtube"></i> يوتيوب</span>' : '<span class="plat-badge plat-fb"><i class="fab fa-facebook"></i> فيسبوك</span>';
    var hasFiles=(c.files||[]).length>0;
    return '<div class="col-md-6 col-lg-4"><div class="content-tile">'+
      '<div class="thumb" style="'+(th?"background-image:url('"+th.replace(/'/g,"%27")+"')":'')+'">'+badge+'</div>'+
      '<div class="body"><div class="title">'+esc(c.title)+'</div><div class="btns">'+
      (hasFiles?'<button type="button" class="btn btn-outline-secondary btn-sm" data-files="'+esc(c.id)+'">عرض ملفات التحميل</button>':'')+
      '<button type="button" class="btn btn-outline-secondary btn-sm" data-det="'+esc(c.id)+'">عرض تفاصيل</button>'+
      (c.videoUrl?'<button type="button" class="btn btn-primary-custom text-white btn-sm" data-openvid="'+esc(c.videoUrl)+'">فتح المحتوى</button>':'')+
      '</div></div></div></div>';
  }
  function render(){
    var list=filtered();
    var pg=paginate(list, page, PER); page=pg.page;
    document.getElementById('grid').innerHTML=pg.items.map(tile).join('')||'<div class="col-12 text-muted">لا محتوى</div>';
    document.querySelectorAll('[data-openvid]').forEach(function(b){ b.onclick=function(){ window.open(b.getAttribute('data-openvid'),'_blank'); }; });
    document.querySelectorAll('[data-det]').forEach(function(b){ b.onclick=function(){
      var found=findById(b.getAttribute('data-det')); if(!found) return;
      var c=found.item;
      glassModal(c.title||'تفاصيل', '<div class="glass-row desc-links" style="white-space:pre-wrap;line-height:1.8">'+linkify(c.description||'لا يوجد وصف')+'</div>'+
        (c.videoUrl?'<a class="btn btn-primary-custom text-white btn-sm" href="'+esc(c.videoUrl)+'" target="_blank" rel="noopener">فتح المحتوى</a>':''));
    };});
    document.querySelectorAll('[data-files]').forEach(function(b){ b.onclick=function(){
      var found=findById(b.getAttribute('data-files')); if(!found) return;
      var files=found.item.files||[];
      glassModal('ملفات التحميل', files.map(function(f){
        return '<div class="glass-row d-flex justify-content-between align-items-center gap-2"><span>'+esc(f.title||'ملف')+'</span><a class="btn btn-sm btn-success" href="'+driveDl(f.url)+'" download>تحميل</a></div>';
      }).join('')||'<div class="text-muted">لا ملفات</div>');
    };});
    renderPager(document.getElementById('pager'), pg.page, pg.total, function(p){page=p;render();});
  }
  renderFilters(); render();
  var autoId=q('id');
  if(autoId){ var found=findById(autoId); if(found&&found.item&&found.item.videoUrl){ window.open(found.item.videoUrl,'_blank'); } }
});

</script>
